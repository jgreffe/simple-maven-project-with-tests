apiVersion: automation.cloudbees.io/v1alpha1                                                                                                                                                                                             
kind: workflow                                                                                                                                                                                                                           
name: edge-runners-demo                                                                                                                                                                                                                  
                                                                                                                                                                                                                                         
on:
  push:
    branches:
      - "**"
  workflow_dispatch:                                                                                                                                                                                                                     
                                                                                                                                                                                                                                         
jobs:                                                                                                                                                                                                                                    
  edge:                                                                                                                                                                                                                                  
    runs-on: [self-hosted, jgreffe]                                                                                                                                                                                           
    steps:                                                                                                                                                                                                                               
      - id: step1                                                                                                                                                                                                                        
        run: |                                                                                                                                                                                                                           
          echo "hello world"                                                                                                                                                                                                             
        env:                                                                                                                                                                                                                             
          key: value                                                                                                                                                                                                                     
      - shell: bash                                                                                                                                                                                                                      
        run: echo "hello again"                                                                                                                                                                                                          
        timeout-minutes: 15                                                                                                                                                                                                              
        env:                                                                                                                                                                                                                             
          key1: value1